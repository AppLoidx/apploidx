<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 112" width="640" height="112" role="img" aria-label="Claude Code terminal">
  <rect x="0" y="0" width="640" height="112" rx="10" fill="#161616"/>
  <!-- pixel crab -->
  <g transform="translate(24,18) scale(7)" fill="#f0442c" shape-rendering="crispEdges">
    <rect x="2" y="0" width="1" height="1"/>
    <rect x="8" y="0" width="1" height="1"/>
    <rect x="1" y="1" width="9" height="1"/>
